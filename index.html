<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c2185b">
<title>Churir Angina &mdash; POS</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--pink:#c2185b;--pink-d:#8e1245;--pink-l:#fdeef5;--gold:#c99a3a;--bg:#fbf7f9;--card:#fff;
--line:#eddfe6;--ink:#2c1d25;--muted:#8a7480;--ok:#16a46a;--warn:#d99413;--bad:#d24545;
--radius:16px;--shadow:0 1px 2px rgba(44,29,37,.04),0 8px 24px rgba(194,24,91,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#e3cfd9;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;
background:radial-gradient(1200px 600px at 20% 10%,#ffeaf3 0%,transparent 60%),
radial-gradient(900px 500px at 90% 90%,#fff3e2 0%,transparent 55%),#fbf7f9}
#gate.hidden{display:none}
.gate-card{width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:22px;
padding:34px 28px;box-shadow:0 20px 60px rgba(194,24,91,.13);animation:pop .45s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.gate-logo{width:60px;height:60px;margin:0 auto 16px;border-radius:19px;background:linear-gradient(135deg,var(--pink),var(--gold));
display:flex;align-items:center;justify-content:center;font-size:27px;color:#fff;font-weight:800;
box-shadow:0 10px 24px rgba(194,24,91,.3)}
.gate-card h1{margin:0;text-align:center;font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.gate-card p.sub{margin:6px 0 22px;text-align:center;color:var(--muted);font-size:12.5px}
.gate-tabs{display:flex;gap:5px;background:#f7eef3;padding:4px;border-radius:13px;margin-bottom:18px}
.gate-tabs button{flex:1;padding:9px;border:0;background:transparent;border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer;transition:.18s}
.gate-tabs button.active{background:#fff;color:var(--pink);box-shadow:0 1px 5px rgba(0,0,0,.07)}
.hidden{display:none !important}

/* ---------- form ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);
border-radius:11px;background:#fff;outline:none;transition:.16s;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(194,24,91,.09)}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- buttons ---------- */
.btn{padding:11px 17px;border:0;border-radius:11px;cursor:pointer;font-weight:600;transition:.16s;
display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;box-shadow:0 4px 14px rgba(194,24,91,.26)}
.btn-primary:hover{box-shadow:0 6px 18px rgba(194,24,91,.34)}
.btn-ghost{background:#fff;color:var(--pink);border:1.5px solid var(--line)}
.btn-ghost:hover{background:var(--pink-l);border-color:#e7c3d5}
.btn-danger{background:#fdeaea;color:var(--bad);border:1.5px solid #f6d4d4}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.btn-lg{padding:16px 20px;font-size:16px;border-radius:14px}

/* ---------- shell ---------- */
#app{display:none;min-height:100vh}
#app.show{display:block}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 18px;
background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.burger{display:none;background:none;border:0;font-size:21px;cursor:pointer;color:var(--pink);padding:2px 4px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.2px}
.brand .dot{width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,var(--pink),var(--gold));
display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:800}
#pageTitle{font-size:13px;font-weight:600;color:var(--muted);padding-left:12px;margin-left:4px;border-left:1px solid var(--line)}
.topbar .spacer{flex:1}
.whoami{font-size:11px;color:var(--muted);text-align:right;line-height:1.3}
.whoami b{display:block;color:var(--ink);font-size:12.5px;font-weight:600}
.layout{display:flex;align-items:flex-start}
.sidebar{width:206px;flex:0 0 206px;padding:14px 10px 40px;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.nav-group{margin-bottom:15px}
.nav-group-label{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#c3aab7;padding:0 12px 6px}
.nav-item{padding:8.5px 12px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink);margin-bottom:2px;transition:.14s;font-size:13.5px}
.nav-item:hover{background:var(--pink-l);color:var(--pink)}
.nav-item.active{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(194,24,91,.22)}
main{flex:1;min-width:0;padding:18px 20px 60px}
.view{display:none}
.view.active{display:block}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.page-head .desc{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:700}
.card.pad0{padding:0;overflow:hidden}
.card.pad0 h3{padding:15px 16px 0}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pink)}
.stat.ok:before{background:var(--ok)}
.stat.warn:before{background:var(--warn)}
.stat.bad:before{background:var(--bad)}
.stat .lbl{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.7px;text-transform:uppercase;margin-bottom:6px}
.stat .val{font-size:21px;font-weight:700;letter-spacing:-.4px}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:13px}
.empty .big{font-size:26px;margin-bottom:8px;opacity:.5}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;background:#fbf5f8;border-bottom:1px solid var(--line);color:var(--muted);
font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #f6eef2}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fffafc}
.table-wrap{overflow-x:auto}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#f4eef1;color:var(--muted)}
.tag-ok{background:#e6f8ef;color:var(--ok)}
.tag-warn{background:#fdf4e3;color:var(--warn)}
.tag-bad{background:#fdecec;color:var(--bad)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.toolbar input,.toolbar select{padding:10px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;outline:none;min-width:170px}
.toolbar input:focus{border-color:var(--pink);box-shadow:0 0 0 3.5px rgba(194,24,91,.09)}

/* ---------- POS ---------- */
.pos-wrap{display:grid;grid-template-columns:1fr 350px;gap:14px;align-items:start}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.prod{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 11px;cursor:pointer;transition:.15s;text-align:left}
.prod:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 10px 22px rgba(194,24,91,.1)}
.prod:active{transform:scale(.97)}
.prod .nm{font-weight:600;font-size:12.5px;margin-bottom:6px;line-height:1.35;min-height:34px}
.prod .pr{color:var(--pink);font-weight:800;font-size:14.5px}
.prod .st{font-size:10.5px;color:var(--muted);margin-top:3px}
.prod.out{opacity:.4;pointer-events:none}
.cart-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);position:sticky;top:64px}
.cart-line{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #f6eef2}
.cart-line .nm{flex:1;font-size:12.5px;font-weight:500;line-height:1.3}
.cart-line input{width:52px;padding:5px;text-align:center;border:1.5px solid var(--line);border-radius:8px}
.qty-btn{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--pink);font-weight:700;cursor:pointer;font-size:15px;line-height:1;flex:0 0 auto}
.qty-btn:hover{background:var(--pink-l)}
.totrow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--muted)}
.totrow span:last-child{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.totrow.big{font-size:18px;font-weight:800;color:var(--ink);border-top:1.5px solid var(--line);margin-top:8px;padding-top:10px}
.totrow.big span:last-child{color:var(--pink);font-weight:800}

/* ---------- modal & toast ---------- */
#modalBack{position:fixed;inset:0;background:rgba(44,29,37,.4);backdrop-filter:blur(3px);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#modalBack.show{display:flex}
.modal{background:#fff;border-radius:19px;padding:22px;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;
animation:pop .28s cubic-bezier(.2,.9,.3,1.25);box-shadow:0 24px 60px rgba(44,29,37,.24)}
.modal h3{margin:0 0 16px;font-size:16.5px;font-weight:700}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
#toastHost{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;font-weight:500;box-shadow:0 10px 28px rgba(0,0,0,.22);animation:tin .28s;max-width:90vw}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
.reveal.in{opacity:1;transform:none}

@media(max-width:1000px){.pos-wrap{grid-template-columns:1fr}.cart-panel{position:static}}
@media(max-width:760px){.burger{display:block}
.sidebar{position:fixed;left:0;top:0;height:100vh;z-index:60;background:#fff;border-right:1px solid var(--line);
transform:translateX(-100%);transition:transform .26s;padding-top:56px;box-shadow:10px 0 34px rgba(0,0,0,.09)}
.sidebar.open{transform:none}main{padding:14px 13px 60px}#pageTitle{display:none}
.page-head h2{font-size:17px}.toolbar input,.toolbar select{min-width:0;flex:1}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">CA</div>
    <h1>Churir Angina</h1>
    <p class="sub">Point of Sale &amp; Inventory System</p>

    <div class="gate-tabs">
      <button id="tabConnectBtn" class="active" onclick="switchGateTab('connect')">Connect</button>
      <button id="tabLoginBtn" onclick="switchGateTab('login')">Login</button>
    </div>

    <div id="tabConnect">
      <div class="field"><label>Supabase URL</label><input id="inUrl" placeholder="https://xxxx.supabase.co"></div>
      <div class="field"><label>Supabase Anon Key</label><input id="inKey" placeholder="eyJhb..."></div>
      <button class="btn btn-primary btn-block" onclick="saveConfig()">Connect</button>
      <p class="sub" style="margin:14px 0 0;">Put your keys inside <b>config.js</b> and this screen will never appear again.</p>
    </div>

    <div id="tabLogin" class="hidden">
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="you@example.com" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="inPass" type="password" placeholder="........" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button id="loginBtn" class="btn btn-primary btn-block btn-lg" onclick="doLogin()">Sign in</button>
      <p id="loginMsg" class="sub" style="margin:13px 0 0;color:var(--bad);"></p>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <button class="burger" onclick="toggleSidebar()">&#9776;</button>
    <div class="brand"><span class="dot">CA</span><span>Churir Angina</span></div>
    <span id="pageTitle">Dashboard</span>
    <div class="spacer"></div>
    <div class="whoami"><b id="waName">&mdash;</b><span id="waRole">&mdash;</span></div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sign out</button>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"><div id="navHost"></div></aside>
    <main id="content">
      <section class="view" id="v-dashboard"></section>
      <section class="view" id="v-pos"></section>
      <section class="view" id="v-products"></section>
      <section class="view" id="v-stock"></section>
      <section class="view" id="v-purchases"></section>
      <section class="view" id="v-sales"></section>
      <section class="view" id="v-returns"></section>
      <section class="view" id="v-customers"></section>
      <section class="view" id="v-suppliers"></section>
      <section class="view" id="v-ledger"></section>
      <section class="view" id="v-expenses"></section>
      <section class="view" id="v-reports"></section>
      <section class="view" id="v-alerts"></section>
      <section class="view" id="v-staff"></section>
      <section class="view" id="v-settings"></section>
    </main>
  </div>
</div>

<div id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBody"></div></div>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="automation.js"></script>
<script src="ux-extras.js"></script>
</body>
</html>
