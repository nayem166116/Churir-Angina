<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c2185b">
<title>চুড়ির আঙিনা — POS</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--pink:#c2185b;--pink-d:#8e1245;--gold:#c99a3a;--bg:#fff7fb;--card:#fff;--line:#f0d7e4;
--ink:#33202a;--muted:#7c6470;--ok:#2fb36d;--warn:#e0a126;--bad:#c94848;--radius:18px;
--shadow:0 6px 24px rgba(194,24,91,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px}
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;
background:linear-gradient(140deg,#fff7fb 0%,#ffeaf3 50%,#fff5e8 100%)}
#gate.hidden{display:none}
.gate-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:24px;
padding:30px 26px;box-shadow:0 18px 50px rgba(194,24,91,.14);animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.gate-logo{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,var(--pink),var(--gold));
display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 22px rgba(194,24,91,.28)}
.gate-card h1{margin:0;text-align:center;font-size:21px;color:var(--pink-d)}
.gate-card p.sub{margin:6px 0 20px;text-align:center;color:var(--muted);font-size:12.5px}
.gate-tabs{display:flex;gap:6px;background:#fdeef5;padding:5px;border-radius:14px;margin-bottom:18px}
.gate-tabs button{flex:1;padding:9px;border:0;background:transparent;border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer;transition:.2s}
.gate-tabs button.active{background:#fff;color:var(--pink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hidden{display:none !important}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fffdfe;outline:none;transition:.18s}
.field input:focus,.field select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(194,24,91,.1)}
.btn{padding:11px 16px;border:0;border-radius:12px;cursor:pointer;font-weight:600;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;box-shadow:0 4px 14px rgba(194,24,91,.28)}
.btn-ghost{background:#fff;color:var(--pink);border:1.5px solid var(--line)}
.btn-danger{background:#fdeaea;color:var(--bad);border:1.5px solid #f6d4d4}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn-lg{padding:15px 20px;font-size:16px;border-radius:14px}
#app{display:none;min-height:100vh}
#app.show{display:block}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:11px 16px;
background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.burger{display:none;background:none;border:0;font-size:22px;cursor:pointer;color:var(--pink)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--pink-d)}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--pink),var(--gold));display:flex;align-items:center;justify-content:center;font-size:15px}
#pageTitle{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px}
.topbar .spacer{flex:1}
.whoami{font-size:12px;color:var(--muted);text-align:right;line-height:1.35}
.whoami b{display:block;color:var(--ink);font-size:13px}
.layout{display:flex;align-items:flex-start}
.sidebar{width:212px;flex:0 0 212px;padding:14px 10px 40px;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto}
.nav-group{margin-bottom:14px}
.nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#c0a4b2;padding:0 12px 6px}
.nav-item{padding:9px 12px;border-radius:11px;cursor:pointer;font-weight:500;color:var(--ink);margin-bottom:2px;transition:.15s;font-size:13.5px}
.nav-item:hover{background:#fdeef5;color:var(--pink)}
.nav-item.active{background:linear-gradient(135deg,var(--pink),var(--pink-d));color:#fff;box-shadow:0 4px 12px rgba(194,24,91,.24)}
main{flex:1;min-width:0;padding:16px 18px 60px}
.view{display:none}
.view.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:14.5px;color:var(--pink-d)}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.stat .val{font-size:21px;font-weight:700;color:var(--pink-d)}
.stat .sub{font-size:11px;color:var(--muted);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 8px;border-bottom:2px solid var(--line);color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
td{padding:9px 8px;border-bottom:1px solid #f7ecf2}
tbody tr:hover{background:#fffafc}
.table-wrap{overflow-x:auto}
.tag{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:11px;font-weight:600;background:#f4eef1;color:var(--muted)}
.tag-ok{background:#e5f7ee;color:var(--ok)}
.tag-warn{background:#fdf3e0;color:var(--warn)}
.tag-bad{background:#fdecec;color:var(--bad)}
.badge{background:var(--pink);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.toolbar input,.toolbar select{padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;outline:none;min-width:150px}
.toolbar input:focus{border-color:var(--pink)}
.pos-wrap{display:grid;grid-template-columns:1fr 370px;gap:14px;align-items:start}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:11px;cursor:pointer;transition:.16s;text-align:center}
.prod:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 8px 20px rgba(194,24,91,.12)}
.prod:active{transform:scale(.96)}
.prod .nm{font-weight:600;font-size:12.5px;margin-bottom:4px;line-height:1.3}
.prod .pr{color:var(--pink);font-weight:700;font-size:13.5px}
.prod .st{font-size:10.5px;color:var(--muted);margin-top:3px}
.prod.out{opacity:.45;pointer-events:none}
.cart-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);position:sticky;top:66px}
.cart-line{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid #f7ecf2}
.cart-line .nm{flex:1;font-size:12.5px;font-weight:500;line-height:1.3}
.cart-line input{width:56px;padding:5px;text-align:center;border:1.5px solid var(--line);border-radius:8px}
.qty-btn{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--pink);font-weight:700;cursor:pointer;font-size:15px;line-height:1}
.totrow{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.totrow.big{font-size:17px;font-weight:700;color:var(--pink-d);border-top:2px solid var(--line);margin-top:7px;padding-top:9px}
#modalBack{position:fixed;inset:0;background:rgba(51,32,42,.42);backdrop-filter:blur(3px);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#modalBack.show{display:flex}
.modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
.modal h3{margin:0 0 14px;color:var(--pink-d);font-size:16px}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
#toastHost{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 8px 26px rgba(0,0,0,.24);animation:tin .3s}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
.reveal.in{opacity:1;transform:none}
@media(max-width:960px){.pos-wrap{grid-template-columns:1fr}.cart-panel{position:static}}
@media(max-width:760px){.burger{display:block}
.sidebar{position:fixed;left:0;top:0;height:100vh;z-index:60;background:#fff;border-right:1px solid var(--line);
transform:translateX(-100%);transition:transform .28s;padding-top:56px;box-shadow:8px 0 30px rgba(0,0,0,.1)}
.sidebar.open{transform:none}main{padding:13px 12px 60px}#pageTitle{display:none}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">💞</div>
    <h1>চুড়ির আঙিনা</h1>
    <p class="sub">Point of Sale &amp; Inventory System</p>

    <div class="gate-tabs">
      <button id="tabConnectBtn" class="active" onclick="switchGateTab('connect')">Connect</button>
      <button id="tabLoginBtn" onclick="switchGateTab('login')">Login</button>
    </div>

    <div id="tabConnect">
      <div class="field"><label>Supabase URL</label><input id="inUrl" placeholder="https://xxx.supabase.co"></div>
      <div class="field"><label>Supabase Anon Key</label><input id="inKey" placeholder="eyJhb..."></div>
      <button class="btn btn-primary btn-block" onclick="saveConfig()">Connect করুন</button>
      <p class="sub" style="margin-top:12px;margin-bottom:0;">config.js file e key bosale ei screen ar ashbe na</p>
    </div>

    <div id="tabLogin" class="hidden">
      <div class="field"><label>Email</label><input id="inEmail" type="email" placeholder="you@example.com" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="inPass" type="password" placeholder="********" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button id="loginBtn" class="btn btn-primary btn-block" onclick="doLogin()">লগইন</button>
      <p id="loginMsg" class="sub" style="margin-top:12px;margin-bottom:0;color:var(--bad);"></p>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <button class="burger" onclick="toggleSidebar()">☰</button>
    <div class="brand"><span class="dot">💞</span><span>চুড়ির আঙিনা</span></div>
    <span id="pageTitle">Dashboard</span>
    <div class="spacer"></div>
    <div class="whoami"><b id="waName">—</b><span id="waRole">—</span></div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Logout</button>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"><div id="navHost"></div></aside>
    <main id="content">
      <section class="view" id="v-dashboard"></section>
      <section class="view" id="v-pos"></section>
      <section class="view" id="v-products"></section>
      <section class="view" id="v-stock"></section>
      <section class="view" id="v-purchases"></section>
      <section class="view" id="v-sales"></section>
      <section class="view" id="v-returns"></section>
      <section class="view" id="v-customers"></section>
      <section class="view" id="v-suppliers"></section>
      <section class="view" id="v-ledger"></section>
      <section class="view" id="v-expenses"></section>
      <section class="view" id="v-reports"></section>
      <section class="view" id="v-alerts"></section>
      <section class="view" id="v-staff"></section>
      <section class="view" id="v-settings"></section>
    </main>
  </div>
</div>

<div id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBody"></div></div>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="automation.js"></script>
<script src="ui-upgrade.js"></script>
</body>
</html>
